name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'docker-compose.yml'
      - 'app/**'
      - 'app/angular-realworld-example-app/**'
      - '.github/workflows/**'
  schedule:
    # Run automatically every night at 02:00 UTC
    - cron: '0 2 * * *'
  # Allow manual trigger from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      grep:
        description: 'Filter tests by tag/grep (e.g. @api, @smoke)'
        required: false
        default: ''

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js environment and enable npm caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Install project dependencies
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # 4. Run static code analysis to catch syntax or async issues early
      - name: Run ESLint
        run: npm run lint

      # 5. Build and start the application services. The E2E container is
      # started separately after the services are reachable.
      - name: Start Docker Compose services
        run: docker compose up --build --detach mongodb api client

      # 6. Compose depends_on controls start order, not application readiness.
      - name: Wait for API and client
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:4000/api/tags >/dev/null \
              && curl --fail --silent http://localhost:4200/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo 'Docker Compose services did not become ready in time.'
          docker compose ps
          exit 1

      # 7. Run Playwright inside the pinned Playwright Docker image.
      - name: Run Playwright tests in Docker Compose
        env:
          CI: true
          TEST_GREP: ${{ github.event.inputs.grep || '' }}
        run: |
          docker compose run --rm \
            --no-deps \
            -e CI=true \
            -e TEST_GREP="$TEST_GREP" \
            e2e \
            sh -c 'if [ -n "$TEST_GREP" ]; then npx playwright test --grep "$TEST_GREP"; else npx playwright test; fi'

      # 8. Preserve service logs when a container or test fails.
      - name: Collect Docker Compose logs
        if: always()
        run: docker compose logs --no-color > docker-compose.log || true

      # 9. Stop all services and remove the CI-only database volume.
      - name: Stop Docker Compose services
        if: always()
        run: docker compose down --volumes --remove-orphans

      # 10. Upload test report, screenshots, traces, and service logs.
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            docker-compose.log
          retention-days: 14
