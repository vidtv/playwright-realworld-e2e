<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Conduit</title>
  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/ionicons/2.0.1/css/ionicons.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@600;700&family=Source+Serif+Pro:wght@400;600&family=Source+Sans+Pro:wght@300;400;600;700&display=swap">
  
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  
    <style>
      :root {
        --brand: #5CB85C;
        --brand-hover: #459245;
      }
  
      body {
        font-family: 'Source Sans Pro', sans-serif;
        color: #373a3c;
      }
  
      /* Navbar */
      .navbar {
        padding: 0.5rem 1rem;
        background: #fff !important;
      }
      .navbar-brand {
        font-family: 'Titillium Web', sans-serif;
        font-weight: 700;
        color: #373a3c !important;
        font-size: 1.5rem;
      }
      .nav-link {
        color: rgba(0,0,0,0.3) !important;
      }
      .nav-link.active {
        color: rgba(0,0,0,0.8) !important;
      }
      /* Green Sign up button in the navbar */
      .nav-item a[href*="register"], 
      .nav-item a[href*="signup"] {
        background-color: var(--brand) !important;
        color: #fff !important;
        border-radius: 1rem;
        padding: 0.35rem 0.8rem !important;
        margin-left: 0.5rem;
      }
  
      /* Banner with a light background like the demo */
      .banner {
        background: #f3f3f3 !important;
        color: #373a3c !important;
        padding: 2rem 0;
        margin-bottom: 2rem;
        text-align: center;
        box-shadow: none !important;
      }
      .banner h1 {
        font-family: 'Titillium Web', sans-serif;
        font-weight: 700;
        font-size: 3.5rem;
        text-shadow: none !important;
        color: #373a3c;
      }
      .banner p {
        color: #aaa;
        font-weight: 300;
        font-size: 1.2rem;
      }
  
      /* Feed tabs */
      .feed-toggle .nav-link {
        border: none !important;
        color: #aaa !important;
      }
      .feed-toggle .nav-link.active {
        background: transparent !important;
        color: var(--brand) !important;
        border-bottom: 2px solid var(--brand) !important;
        border-radius: 0;
      }
  
      /* Tags on the right */
      .sidebar {
        padding: 5px 10px 10px 10px;
        background: #f3f3f3;
        border-radius: 4px;
      }
      .tag-pill {
        color: #fff !important;
        background-color: #687077;
        padding: 0.2rem 0.6rem;
        border-radius: 10rem;
        font-size: 0.8rem;
        display: inline-block;
        margin-right: 3px;
        margin-bottom: 0.2rem;
      }
      .tag-outline {
        border: 1px solid #ddd;
        color: #aaa !important;
        background: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    -->
  </body>
</html>
